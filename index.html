<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Morning Vibe Check</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400;1,9..144,500&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Layout: one centered column on a sunrise gradient; a glass card runs the quiz one question at a time, then shows the result */
:root {
  --sun: #FF9E7D;
  --morning: #FFE494;
  --cream: #FFFDF9;
  --ink: #001965;
  --ink-soft: #3B4A7A;
  --accent: #005AD2;
  --glass: rgba(255, 255, 255, 0.55);
  --glass-edge: rgba(255, 255, 255, 0.75);
  --track: rgba(0, 25, 101, 0.08);
  --coral: #FF6F61;
  --slate: #6A7FDB;
  --pink: #FF4FA3;
  --f-display: "Fraunces", "Iowan Old Style", Georgia, serif;
  --f-body: "Manrope", "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { min-height: 100%; background: var(--cream); }
body {
  min-height: 100vh; margin: 0;
  font-family: var(--f-body); font-size: 16px; line-height: 1.55; color: var(--ink);
  background: linear-gradient(172deg, var(--sun) 0%, var(--morning) 42%, var(--cream) 82%);
  background-attachment: fixed;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 40px 56px;
  overflow-x: hidden;
}
.sun {
  position: fixed; left: 50%; top: -180px; width: 520px; height: 520px;
  transform: translateX(-50%); border-radius: 50%;
  background: radial-gradient(circle, rgba(255,253,249,0.9) 0%, rgba(255,228,148,0.5) 40%, rgba(255,158,125,0) 70%);
  pointer-events: none; z-index: 0; animation: rise 2.4s ease-out both;
}
@keyframes rise { from { transform: translate(-50%, 60px); opacity: .4; } to { transform: translate(-50%, 0); opacity: 1; } }

main { position: relative; z-index: 1; max-width: 580px; margin: 0 auto; display: flex; flex-direction: column; gap: 26px; }

header { text-align: center; display: flex; flex-direction: column; gap: 12px; padding-top: 20px; }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-soft); }
h1 {
  font-family: var(--f-display); font-weight: 400; font-style: italic;
  font-size: clamp(2.3rem, 7vw, 3.4rem); line-height: 1.05; margin: 0; letter-spacing: -0.01em; text-wrap: balance;
}
.sub { margin: 0 auto; max-width: 40ch; font-size: 1.05rem; color: var(--ink-soft); text-wrap: balance; }

.card {
  background: var(--glass); border: 1px solid var(--glass-edge); border-radius: 24px;
  box-shadow: 0 20px 50px -20px rgba(0, 25, 101, 0.25), 0 2px 6px rgba(0, 25, 101, 0.05);
  -webkit-backdrop-filter: blur(18px) saturate(140%); backdrop-filter: blur(18px) saturate(140%);
  padding: 28px clamp(20px, 5vw, 32px);
  display: flex; flex-direction: column; gap: 22px;
}
.fade { animation: appear .4s ease-out both; }
@keyframes appear { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

/* progres */
.progress { display: flex; align-items: center; gap: 14px; }
.dots { display: flex; gap: 6px; flex: 1; }
.dot { flex: 1; height: 6px; border-radius: 999px; background: var(--track); transition: background .3s; }
.dot.done { background: var(--ink); }
.dot.now { background: var(--accent); }
.step { font-size: 13px; font-weight: 700; color: var(--ink-soft); font-variant-numeric: tabular-nums; white-space: nowrap; }

.question { font-family: var(--f-display); font-size: clamp(1.35rem, 4.5vw, 1.65rem); font-weight: 500; line-height: 1.2; margin: 0; text-wrap: balance; }

.options { display: flex; flex-direction: column; gap: 10px; }
.opt {
  display: flex; align-items: center; gap: 14px; width: 100%; text-align: left;
  font: 600 1rem/1.35 var(--f-body); color: var(--ink);
  background: rgba(255,255,255,0.8); border: 1.5px solid rgba(0,25,101,0.12);
  border-radius: 16px; padding: 14px 16px; cursor: pointer;
  transition: border-color .2s, transform .15s, background .2s;
}
.opt:hover { border-color: rgba(0,25,101,0.35); transform: translateY(-1px); }
.opt:focus-visible { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px rgba(0,90,210,0.18); }
.opt.picked { background: var(--ink); color: var(--cream); border-color: var(--ink); }
.opt .em { flex: 0 0 auto; width: 40px; height: 40px; display: grid; place-items: center; font-size: 1.3rem; border-radius: 12px; background: rgba(255,228,148,0.6); }
.opt.picked .em { background: rgba(255,255,255,0.15); }

.nav { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.link {
  font: 600 .95rem var(--f-body); color: var(--ink-soft); background: none; border: 0; padding: 6px 2px; cursor: pointer;
  text-decoration: underline; text-underline-offset: 3px;
}
.link:hover { color: var(--ink); }
.link:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

.btn {
  font: 700 1rem var(--f-body); color: var(--cream); background: var(--ink); border: 0; border-radius: 14px;
  padding: 15px 24px; cursor: pointer; box-shadow: 0 10px 24px -10px rgba(0,25,101,0.6);
  transition: transform .15s, background .2s;
}
.btn:hover { background: var(--accent); transform: translateY(-1px); }
.btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.btn.ghost { background: rgba(255,255,255,0.85); color: var(--ink); box-shadow: none; border: 1.5px solid rgba(0,25,101,0.2); }
.btn.ghost:hover { background: #fff; border-color: var(--ink); }
.nav.wrap { flex-wrap: wrap; justify-content: flex-start; }
.copied { font-size: .9rem; font-weight: 600; color: var(--ink-soft); width: 100%; margin: 0; }
#share-text { width: 100%; font: 500 .9rem var(--f-body); color: var(--ink); background: rgba(255,255,255,0.9); border: 1.5px solid rgba(0,25,101,0.15); border-radius: 12px; padding: 10px 12px; resize: none; }

/* intro */
.intro { display: flex; flex-direction: column; gap: 18px; align-items: flex-start; }
.intro p { margin: 0; color: var(--ink-soft); max-width: 52ch; }
.intro .meta { font-size: .9rem; font-weight: 600; color: var(--ink); }

/* rezultat */
.res-kicker { font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-soft); }
.res-title { font-family: var(--f-display); font-weight: 500; font-size: clamp(1.7rem, 5.5vw, 2.1rem); line-height: 1.1; margin: 4px 0 0; text-wrap: balance; }
.res-text { margin: 0; color: var(--ink-soft); max-width: 60ch; }

.energy { display: flex; flex-direction: column; gap: 8px; }
.energy-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.energy-label { font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-soft); }
.energy-pct { font-family: var(--f-display); font-size: 1.6rem; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--bar); }
.track { height: 16px; border-radius: 999px; background: var(--track); overflow: hidden; }
.fill {
  height: 100%; width: 0; border-radius: inherit; position: relative;
  background: linear-gradient(90deg, color-mix(in srgb, var(--bar) 55%, white), var(--bar));
  transition: width 1.1s cubic-bezier(.2,.8,.2,1);
}
.fill::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.45), transparent);
  animation: shimmer 2.2s ease-in-out infinite;
}
@keyframes shimmer { from { transform: translateX(-100%); } to { transform: translateX(100%); } }
.energy-note { font-weight: 600; }

.mix { display: flex; flex-direction: column; gap: 10px; }
.mix-title { font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-soft); }
.mix-row { display: grid; grid-template-columns: minmax(0, 9.5rem) 1fr 3ch; gap: 10px; align-items: center; font-size: .92rem; }
.mix-row span:first-child { font-weight: 600; min-width: 0; }
.mix-bar { height: 8px; border-radius: 999px; background: var(--track); overflow: hidden; }
.mix-bar i { display: block; height: 100%; border-radius: inherit; transition: width .9s ease-out; }
.mix-row b { text-align: right; font-variant-numeric: tabular-nums; }

.tip { background: rgba(255,255,255,0.75); border-radius: 18px; padding: 16px 18px; display: flex; gap: 14px; align-items: flex-start; }
.tip-sun { flex: 0 0 auto; width: 36px; height: 36px; border-radius: 50%; background: radial-gradient(circle at 50% 60%, var(--morning), var(--sun)); box-shadow: 0 0 0 6px rgba(255,158,125,0.2); }
.tip strong { display: block; font-size: .8rem; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-soft); }
.tip p { margin: 2px 0 0; }

.divider { height: 1px; background: rgba(0,25,101,0.1); }

footer { text-align: center; display: flex; flex-direction: column; gap: 4px; }
.slogan { font-family: var(--f-display); font-style: italic; font-size: 1.15rem; }

@media (max-width: 420px) { .mix-row { grid-template-columns: minmax(0, 7.5rem) 1fr 3ch; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

<div class="sun" aria-hidden="true"></div>

<main>
  <header>
    <span class="eyebrow">Morning Vibe Check</span>
    <h1>Cum te găsește dimineața?</h1>
    <p class="sub">Cinci întrebări rapide, zero răspunsuri greșite. Află ce fel de dimineață ți se potrivește, acceptă provocarea și dă-o mai departe.</p>
  </header>

  <section class="card" id="card" aria-live="polite"></section>

  <footer>
    <span class="slogan">Ziua bună se cunoaște de dimineață.</span>
  </footer>
</main>

<script>
(function () {
  var personas = {
    adele: {
      name: "Dirijorul de dimineață 🎼",
      short: "Dirijorul",
      pct: 40, color: "var(--coral)",
      note: "Am trecut și peste dimineața asta",
      text: "Dimineața ta e o orchestră cu zece instrumente, iar bagheta e la tine. Pornești în viteză, jonglezi cu cinci lucruri deodată și, cumva, totul iese ca la carte. Ai și reflexe de super-erou: când cineva strigă „Unde e...?”, tu știi deja răspunsul.",
      tip: "După ce lași copiii la școală, pune-ți melodia preferată și ascult-o până la capăt. E pauza ta."
    },
    john: {
      name: "Pragmaticul dimineții 📰",
      short: "Pragmaticul",
      pct: 50, color: "var(--slate)",
      note: "Gata pentru orice discuție",
      text: "Fără dramă, fără grabă, fără surprize. O cafea, un ochi pe știrile zilei și ești deja cel mai informat om din încăpere. Pleci de acasă cu toate datele la zi și cu o părere clară despre fiecare.",
      tip: "Coboară cu o stație mai devreme și ascultă din mers, la căști, rezumatul meciului de aseară."
    },
    sophie: {
      name: "The Diva of the morning 🎬",
      short: "The Diva",
      pct: 85, color: "var(--pink)",
      note: "Baterie plină, modul scenă activat",
      text: "Dimineața ta arată ca intro-ul unui film: coloană sonoră bună, lumină frumoasă și o intrare în scenă calculată la secundă. Ai talentul rar de a transforma o zi obișnuită într-un mic eveniment.",
      tip: "Alege-ți ținuta de cu seară și vezi dacă dimineața te mai convinge."
    }
  };

  var questions = [
    { q: "Sună alarma. Primul tău gând este...",
      a: [["🏃", "Pachetele, hainele și la 7:30 ieșim pe ușă!", "adele"],
          ["📱", "Ia să văd care sunt știrile zilei.", "john"],
          ["👗", "Cu ce mă îmbrac azi?", "sophie"]] },
    { q: "Cafeaua ta de dimineață e...",
      a: [["⏱️", "Băută în picioare, între două treburi", "adele"],
          ["☕", "Neagră, la masă, fără grabă", "john"],
          ["🥛", "Un latte frumos, eventual și fotografiat", "sophie"]] },
    { q: "Ce se aude la tine în casă la 7:30?",
      a: [["🔑", "„Unde sunt cheile?!” și ușa de la frigider", "adele"],
          ["📻", "Un podcast sau buletinul de știri", "john"],
          ["🎶", "Muzică bună, cu volumul sus", "sophie"]] },
    { q: "Cât timp petreci în fața oglinzii?",
      a: [["⚡", "Cât să-mi prind părul din mers", "adele"],
          ["🪞", "Exact cât trebuie, nici un minut în plus", "john"],
          ["🧴", "O rutină în mai mulți pași, făcută cu drag", "sophie"]] },
    { q: "La ora 9:00 ești deja...",
      a: [["✅", "Cu jumătate din lista familiei bifată", "adele"],
          ["🗞️", "La curent cu tot și abia acum încălzit", "john"],
          ["🌞", "Plin de energie și gata de orice", "sophie"]] }
  ];

  var card = document.getElementById("card");
  var answers = [];
  var idx = 0;

  function el(html) { var d = document.createElement("div"); d.innerHTML = html; return d; }
  function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;"); }

  function renderIntro() {
    card.innerHTML = "";
    var n = el(
      '<div class="intro fade">' +
        '<p class="question">Ce fel de dimineață ai tu?</p>' +
        '<p>Răspunde instinctiv la cinci întrebări despre primele ore din zi. La final primești profilul tău de dimineață și bateria ta de energie.</p>' +
        '<span class="meta">5 întrebări · aproximativ 1 minut</span>' +
        '<button class="btn" id="start" type="button">Începe quiz-ul</button>' +
      '</div>');
    card.appendChild(n.firstChild);
    document.getElementById("start").addEventListener("click", function () { idx = 0; answers = []; renderQ(); });
  }

  function renderQ() {
    var Q = questions[idx];
    var dots = questions.map(function (_, i) {
      return '<span class="dot' + (i < idx ? " done" : i === idx ? " now" : "") + '"></span>';
    }).join("");
    var opts = Q.a.map(function (o, i) {
      return '<button type="button" class="opt' + (answers[idx] === o[2] ? " picked" : "") + '" data-p="' + o[2] + '" id="q' + idx + 'o' + i + '">' +
        '<span class="em" aria-hidden="true">' + o[0] + '</span><span>' + esc(o[1]) + '</span></button>';
    }).join("");
    card.innerHTML =
      '<div class="progress"><div class="dots" aria-hidden="true">' + dots + '</div>' +
      '<span class="step">Întrebarea ' + (idx + 1) + ' din ' + questions.length + '</span></div>' +
      '<div class="fade" style="display:flex;flex-direction:column;gap:18px">' +
        '<p class="question" id="qtext">' + esc(Q.q) + '</p>' +
        '<div class="options" role="group" aria-labelledby="qtext">' + opts + '</div>' +
      '</div>' +
      '<div class="nav">' +
        (idx > 0 ? '<button type="button" class="link" id="back">← Înapoi</button>' : '<span></span>') +
        '<button type="button" class="link" id="restart">Ia-o de la capăt</button>' +
      '</div>';

    card.querySelectorAll(".opt").forEach(function (b) {
      b.addEventListener("click", function () {
        answers[idx] = b.getAttribute("data-p");
        card.querySelectorAll(".opt").forEach(function (x) { x.classList.remove("picked"); });
        b.classList.add("picked");
        setTimeout(function () {
          idx++;
          if (idx < questions.length) renderQ(); else renderResult();
        }, 260);
      });
    });
    var back = document.getElementById("back");
    if (back) back.addEventListener("click", function () { idx--; renderQ(); });
    document.getElementById("restart").addEventListener("click", renderIntro);
    var first = card.querySelector(".opt"); if (first) first.focus({ preventScroll: true });
  }

  function winner() {
    var c = { adele: 0, john: 0, sophie: 0 };
    answers.forEach(function (a) { c[a]++; });
    var max = Math.max(c.adele, c.john, c.sophie);
    var tied = Object.keys(c).filter(function (k) { return c[k] === max; });
    if (tied.length === 1) return { key: tied[0], counts: c };
    // la egalitate decide ultimul raspuns dintre cele la egalitate
    for (var i = answers.length - 1; i >= 0; i--) if (tied.indexOf(answers[i]) > -1) return { key: answers[i], counts: c };
    return { key: tied[0], counts: c };
  }

  function renderResult() {
    var w = winner(), P = personas[w.key], total = answers.length;
    var mix = ["adele", "john", "sophie"].map(function (k) {
      var p = Math.round(w.counts[k] / total * 100);
      return '<div class="mix-row"><span>' + personas[k].short + '</span>' +
        '<span class="mix-bar"><i style="width:0;background:' + personas[k].color + '" data-w="' + p + '"></i></span>' +
        '<b>' + p + '%</b></div>';
    }).join("");

    card.innerHTML =
      '<div class="fade" style="display:flex;flex-direction:column;gap:22px">' +
        '<div><span class="res-kicker">Profilul tău de dimineață</span>' +
        '<h2 class="res-title">' + P.name + '</h2></div>' +
        '<p class="res-text">' + P.text + '</p>' +
        '<div class="energy" style="--bar:' + P.color + '">' +
          '<div class="energy-head"><span class="energy-label">Bateria ta de dimineață</span>' +
          '<span class="energy-pct" id="pct">0%</span></div>' +
          '<div class="track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + P.pct + '" aria-label="' + P.note + '"><div class="fill" id="fill"></div></div>' +
          '<span class="energy-note">' + P.note + '</span>' +
        '</div>' +
        '<div class="divider"></div>' +
        '<div class="mix"><span class="mix-title">Mixul tău de dimineață</span>' + mix + '</div>' +
        '<div class="tip"><div class="tip-sun" aria-hidden="true"></div><div><strong>Mica ta provocare</strong><p>' + P.tip + '</p></div></div>' +
        '<div class="nav wrap"><button type="button" class="btn" id="share">Dă provocarea mai departe</button>' +
          '<button type="button" class="btn ghost" id="again">Joacă din nou</button>' +
          '<p class="copied" id="copied" hidden></p></div>' +
      '</div>';

    var fill = document.getElementById("fill"), pct = document.getElementById("pct");
    requestAnimationFrame(function () { requestAnimationFrame(function () {
      fill.style.width = P.pct + "%";
      card.querySelectorAll(".mix-bar i").forEach(function (i) { i.style.width = i.getAttribute("data-w") + "%"; });
    }); });
    var start = performance.now();
    (function tick(now) {
      var t = Math.min(1, (now - start) / 1000), e = 1 - Math.pow(1 - t, 3);
      pct.textContent = Math.round(P.pct * e) + "%";
      if (t < 1) requestAnimationFrame(tick);
    })(start);

    document.getElementById("again").addEventListener("click", function () { idx = 0; answers = []; renderQ(); });

    var msg = "Am făcut Morning Vibe Check și dimineța mea e „" + P.name.replace(/\s*\S+$/, "") + "”. Tu ce fel de dimineață ai? Ziua bună se cunoaște de dimineață!";
    document.getElementById("share").addEventListener("click", function () {
      var out = document.getElementById("copied");
      function fallback() {
        out.hidden = false;
        out.innerHTML = 'Copiază mesajul de mai jos și trimite-l prietenilor:<br><textarea id="share-text" rows="3" readonly></textarea>';
        var ta = document.getElementById("share-text"); ta.value = msg; ta.focus(); ta.select();
      }
      try {
        navigator.clipboard.writeText(msg).then(function () {
          out.hidden = false; out.textContent = "Mesajul a fost copiat. Trimite-l prietenilor și vezi ce fel de dimineață au ei.";
        }, fallback);
      } catch (e) { fallback(); }
    });
  }

  renderIntro();
})();
</script>

</body></html>
